<div class="auth-wrapper">
  <div class="auth-card">
    
    <!-- Brand / Logo -->
    <div class="brand">
      <div class="brand-icon">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0110 0v4"></path>
        </svg>
      </div>
      <span class="brand-name">Shoppix</span>
      <span class="brand-dot"></span>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="title">Create Account</h1>
    <p class="subtitle">
      Join Shoppix today to unlock tailored recommendations, track orders, and discover new drops.
    </p>

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- Full Name -->
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-container">
          <span class="field-icon">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </span>
          <input 
            type="text" 
            formControlName="fullName" 
            placeholder="Alex Morgan"
            class="form-input"
          />
        </div>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-container">
          <span class="field-icon">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="alex.morgan@example.com"
            class="form-input"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-container">
          <span class="field-icon">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
          </span>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="At least 8 characters"
            class="form-input password-padding"
          />
          <button 
            type="button" 
            (click)="togglePasswordVisibility()" 
            class="toggle-password">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-container">
          <span class="field-icon">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
          </span>
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            placeholder="Repeat your password"
            class="form-input password-padding"
          />
          <button 
            type="button" 
            (click)="toggleConfirmPasswordVisibility()" 
            class="toggle-password">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <span 
          *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched"
          class="error-text">
          Passwords do not match
        </span>
      </div>

      <!-- Terms & Conditions -->
      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="acceptTerms" />
          <span>I agree to the <a href="#" class="inline-link">Terms of Service</a> & <a href="#" class="inline-link">Privacy Policy</a></span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="registerForm.invalid" class="submit-btn">
        <span>Create Account</span>
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-text">Or continue with</span>
      </div>

      <!-- Social Logins -->
      <div class="social-buttons">
        <button type="button" class="social-btn">
          <svg class="social-icon" fill="currentColor" viewBox="0 0 170 170">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.08-7.7-7.93-12.04-14.54-6.08-9.17-10.8-19.78-14.16-31.81-3.36-12.03-5.04-23.47-5.04-34.31 0-14.93 3.65-27.12 10.96-36.58 7.3-9.46 16.48-14.28 27.54-14.47 5.03 0 10.59 1.34 16.68 4.01 6.09 2.68 9.92 4.02 11.51 4.02 1.37 0 5.25-1.39 11.64-4.17 6.39-2.78 11.96-3.95 16.71-3.5 12.39 1.05 22.38 5.76 29.98 14.12-10.91 6.64-16.24 15.82-16 27.53.24 9.17 3.79 16.92 10.66 23.25 6.87 6.33 14.99 9.94 24.36 10.84-2.17 6.55-4.75 13.06-7.74 19.53zM119.22 33.06c0-7.22 2.62-13.88 7.86-19.98 5.23-6.1 11.64-9.87 19.23-11.31.25 1.48.38 2.87.38 4.18 0 7.14-2.73 13.91-8.2 20.31-5.46 6.39-12 10.15-19.61 11.27-.12-1.39-.18-2.67-.18-3.83z"/>
          </svg>
          Apple ID
        </button>

        <button type="button" class="social-btn">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google
        </button>
      </div>

    </form>

    <!-- Bottom Switch Link -->
    <div class="switch-section">
      Already have an account? 
      <a routerLink="/login">Sign in</a>
    </div>

    <!-- Security Badge -->
    <div class="security-badge-wrapper">
      <div class="security-badge">
        <svg class="security-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"/>
        </svg>
        <span>End-to-End Encryption · 256-bit TLS Protected</span>
      </div>
    </div>

  </div>
</div>
