<div
  class="bg-white shadow-sm m-2 hover:shadow-md cursor-pointer p-4 rounded-2xl flex flex-col justify-between border-b-0  hover:border-b-4 hover:border-green-800 transition-all duration-100 ease-in-out group"
  [routerLink]="['/product-details', product().id]">
  
  <div class="relative rounded-xl overflow-hidden w-full h-48 bg-gray-50 mb-3">
    <img [alt]="product().name" [src]="product().image"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />

    <span
      class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-xs font-semibold text-green-950 px-2.5 py-1 rounded-lg shadow-sm">
      Stock: {{product().stockQuantity}}
    </span>
  </div>

  <div class="mb-4">
    <h2 class="text-gray-900 font-bold text-base line-clamp-1 mb-1">{{product().name}}</h2>
    <p class="text-gray-500 text-xs line-clamp-2 leading-relaxed">{{product().description}}</p>
  </div>

  <div class="flex items-center justify-between pt-2 border-t border-gray-50 mt-auto">
    <div>
      <span class="text-gray-400 text-xs block font-medium">Price</span>
      <span class="text-gray-900 font-bold text-lg">{{ product().price | currency:'USD':'symbol':'1.2-2' }}</span>
    </div>

    <button (click)="onAddToCart()" class="bg-emerald-800  hover:bg-emerald-900 text-white p-2.5 rounded-xl transition-colors shadow-md">
          <svg lucideShoppingCartPlus></svg>
    </button>
  </div>

</div>
