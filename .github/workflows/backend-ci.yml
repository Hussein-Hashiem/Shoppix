name: Backend CI

# Runs on every PR that touches the backend, targeting back-develop or main
on:
  pull_request:
    branches: [back-develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match <TargetFramework> in your .csproj (net8.0 -> 8.0.x, net9.0 -> 9.0.x, net10.0 -> 10.0.x)
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
