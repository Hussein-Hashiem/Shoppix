name: Frontend CI

# Runs on every PR that touches the frontend, targeting front-develop or main
on:
  pull_request:
    branches: [front-develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node 22.22+ or 24.13+; 24.x (LTS) satisfies it
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Run unit tests
        # Vitest is the default runner in new Angular projects
        run: npx ng test --no-watch
