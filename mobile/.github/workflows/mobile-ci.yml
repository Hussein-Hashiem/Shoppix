name: Mobile CI

# Runs on every PR that touches the mobile app, targeting mobile-develop or main
on:
  pull_request:
    branches: [mobile-develop, main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Latest stable release. To pin the team's version, replace with:
          #   flutter-version: "x.y.z"
          # and remove the channel line
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
